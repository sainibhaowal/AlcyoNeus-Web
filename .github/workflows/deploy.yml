name: Build Docker Container & Deploy to VPS (Manual)

on:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: "Deploy to VPS after building container?"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alcyoneus-web

jobs:
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Image Name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy Container to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_to_vps }}
    steps:
      - name: SSH into VPS and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/opt/alcyoneus-web"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Download official production compose file directly from repository
            curl -sSL https://raw.githubusercontent.com/sainibhaowal/AlcyoNeus-Web/main/docker-compose.prod.yml -o docker-compose.prod.yml

            echo "🚀 [1/4] Pulling latest production container from GHCR..."
            docker compose -f docker-compose.prod.yml pull

            echo "⚡ [2/4] Deploying container with zero-downtime (--wait & --remove-orphans)..."
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans

            echo "🧹 [3/4] Safely cleaning up dangling images & build cache (isolated to old layers)..."
            docker image prune -f || true
            docker builder prune -f || true

            echo "✅ [4/4] Verified healthy and continuously running:"
            docker compose -f docker-compose.prod.yml ps
