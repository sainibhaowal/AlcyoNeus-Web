name: Build Docker Container & Deploy to VPS (Manual)

on:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: "Deploy to VPS after building container?"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alcyoneus-web

jobs:
  build-and-push:
    name: Build & Push Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Image Name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy Container to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: inputs.deploy_to_vps == true
    steps:
      - name: SSH into VPS and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):latest"
            
            echo "🚀 [1/3] Pulling latest pre-built container from GHCR..."
            docker pull $IMAGE
            
            echo "🔄 [2/3] Replacing running container..."
            docker stop alcyoneus_web || true
            docker rm alcyoneus_web || true
            
            echo "⚡ [3/3] Starting updated container on 127.0.0.1:3000..."
            docker run -d \
              --name alcyoneus_web \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e HOSTNAME=0.0.0.0 \
              --memory=512m \
              $IMAGE
            
            # Clean up old unused images to save VPS disk space
            docker image prune -f || true
            
            echo "✅ Container running successfully:"
            docker ps -f name=alcyoneus_web
